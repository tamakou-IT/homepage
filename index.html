<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>情報技術サークル | メインページ</title>

    <!-- 共通CSS -->
    <link rel="stylesheet" href="css/common.css">

    <!-- index.html固有CSS -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/workdesign.css">
    <link rel="stylesheet" href="css/reportsdesign.css">

    <!-- favicon -->
    <link rel="icon" type="image/png" href="images/icon.svg">

</head>

<body>

    <!-- ヘッダー -->
    <div id="site_header"></div>


    <main>

        <!-- ヒーローセクション -->
        <section class="hero">

            <div class="hero_inner">

                <p class="hero_catch">
                    MAKE · LEARN · SHARE
                </p>

                <h1 class="hero_title">
                    情報技術サークル
                </h1>

                <p class="hero_text">
                    情報技術サークルは、競技プログラミング、webサイト制作などを
                    楽しみながら学びます。
                </p>

                <a class="hero_button" href="works.html">
                    サークルを知る
                </a>

            </div>

        </section>


        <!-- 作品＆成果物 -->
        <section class="section_works">

            <div class="section_inner">

                <div class="section_header">
                    <span class="section_sub">PICKUP WORKS</span>
                    <h2 class="section_title">作品＆成果物</h2>
                    <p class="section_text">
                        制作した作品や成果物を紹介します。タップすると外部サイトに移動します。
                    </p>
                </div>

                <!-- 新着成果物4件をworks.jsが表示 -->
                <div class="site_works" data-count="4"></div>

                <!-- もっと見るボタン -->
                <div class="section_more">
                    <a class="section_more_btn" href="works.html">
                        <span>もっと見る</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>
                </div>

            </div>

        </section>

       <!-- 活動報告 -->
        <section class="section_reports">

            <div class="section_inner">

                <div class="section_header">
                    <span class="section_sub">ACTIVITY REPORTS</span>
                    <h2 class="section_title">活動報告</h2>
                    <p class="section_text">
                        ITサークルの活動内容を記した記事が表示されます
                    </p>
                </div>

                <!-- 新着成果物4件をreports.jsが表示 -->
                <div class="site_reports" data-count="4"></div>

                <!-- もっと見るボタン -->
                <div class="section_more">
                    <a class="section_more_btn" href="reports.html">
                        <span>もっと見る</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>
                </div>

            </div>

        </section>


    </main>


    <!-- フッター -->
    <div id="site_footer"></div>


    <!-- 共通ヘッダー・フッター -->
    <script src="js/headfooter.js"></script>

    <!-- 成果物一覧 -->
    <script src="js/works.js"></script>

    <!-- レポート一覧 -->
    <script src="js/reports.js"></script>

</body>

</html>
